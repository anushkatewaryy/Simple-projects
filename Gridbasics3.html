<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid 3</title>
</head>
<style>
    body{ font-family: Arial, Helvetica, sans-serif;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
        background-color: #f0f0f0;

    }
    h1{color: #333;}
    .container{
        border: 2px solid #333;
        margin-bottom: 20px;
        padding: 10px;
    }
    .box:nth-child(even){
        background-color: #e74c3c;
    }
    .box:nth-child(odd){background: #5576f8;}
    .box{color: white;
    padding: 10px;
    font-size: 18px;
    text-align: center;
    margin-bottom: 20px;}
    .grid-container{
        display: grid;
        gap: 5px;
        background-color: #ddd;
        padding: 10px;
        margin-bottom: 10px;
    }
</style>
<body>
    <div class="container">
    <h1>Grid 1 (3*3)</h1>
    <div class="grid-container"
    style="grid-template-columns: repeat(3, 1fr);
    grid-template-columns: repeat(3, 100px);">

    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
    <div class="box">7</div>
    <div class="box">8</div>
    <div class="box">9</div>
    </div>
    </div>
    <div class="container" >
        <h2>2.Grid 2</h2>
        <div class="grid-container" style="grid-template-columns: 1fr 2fr 1fr;">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        </div>
    </div>
    <div class="container">
        <h2>Grid 3</h2>
        <div class="grid-container" style="grid-template-columns: repeat(3,1fr); gap: 20px;" >
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        </div>
    </div>
    <div class="continer">
        <h2>Grid 4</h2>
        <div class="grid-container" style="grid-template-columns: repeat(3,1fr);
        grid-template-rows: repeat(3,100px); gap: 8px; display: grid; " >
        <div class="box" 
        style="grid-column: 1/3; 
        grid-row: 1/3;
         height: 190px;"
         >1</div>
        <div class="box" style="height: 80px;">2</div>
        <div class="box" style="height: 80px;">3</div>
        <div class="box" style="height: 80px;" >4</div>
        <div class="box" style="grid-column: 2/4; height: 80px;">5</div>
        </div>
    </div>
    <div class="container">
        <h2>Grid5</h2>
        <div class="grid-container" 
        style="grid-template-areas: 'Header Header Header' 'Sidebar Main Main' 'Footer Footer Footer';"
        >
            <div class="box" style="grid-area: Header; height: 80px;">Header</div>
            <div class="box" style="grid-area: Sidebar; height: 80px;">Sidebar</div>
            <div class="box" style="grid-area: Main; height: 80px;">Main</div>
            <div class="box" style="grid-area: Footer; height: 80px;">Footer</div>
        </div>
    </div>
    <div class="container">
        <h2>Grid 6</h2>
        <div class="grid-container"
        style="grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
        </div>
        <div class="container">
            <h2>Grid 7</h2>
            <div class="grid-container"
            style="grid-template-columns: repeat(3,1fr); 
            height: 200px;
            align-items: center;
            ">
                <div class="box">1</div>
                <div class="box">2</div>
                <div class="box">3</div>
            </div>

        </div>
        <div class="container">
            <h2>Grid 8</h2>
            <div class="grid-container"
            style="grid-template-columns: 1fr 1fr;">
                <div class="box">1</div>
            <div class="grid-container"
            style="grid-template-columns: 1fr 1fr;">

                <div class="box"
                style="background-color: #27ae60;">1.1</div>
                <div class="box"
                style="background-color: #27ae60;">1.2</div>
                <div class="box"
                style="background-color: #27ae60;">1.3</div>
                <div class="box"
                style="background-color: #27ae60;">1.4</div>
            </div>
            </div>
            

        </div>
    </div>
    

    
</body>
</html>
