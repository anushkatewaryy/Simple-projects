<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nav-bar</title>
</head>
<style>
    body {background-color: #1f1d1d;}
    h2 {color:#fff}
    .nav1 li a {
        padding: 5px 90px;
        text-decoration: none;
        position: relative;
         width: 40%;       /* underline is only 60% of link */
    height: 2px;

    left: 0;       /* centers the underline */
    bottom: -3px;
    }
     .nav1 li a::after{
        content: "";
        position: absolute;
        display:block;
        width:100%;
        height: 3px;
        left:0;
        bottom:0;
        background:blueviolet; 
        transition: width 0.3s; 
        transform: scaleX(0);
        transition: transform 0.3s
        ease-in-out ;  }   
        .nav1 li a:hover::after {
    width: 100%;
    transform: scaleX(1)
}
.nav1 {display: flex;
gap: 50px;
justify-content: center;
align-items: center;
 list-style: none;
    padding: 0;
    margin: 0;
    left: 0;

    gap: 2px;}
    .nav1 .login-btn{ background-color: rgb(72, 72, 247);
    border-radius: 5px;
    border:0;
color: #fff;
width: 80px;
padding: 10px 25px;
box-sizing: content-box;}
    .nav2{
        background-color: #62ab25;
        width: 200px;
        padding: 20px;
        margin-right: 20px;

}
    .nav2 .login-btn {background-color: #0c5c04;
    color: #fff;
    width: 100%;
    padding: 10px;
    cursor: pointer;
    border: 0;}
    .nav2 .login-btn:hover{background-color: #07a715;}
    .nav2 ul {
        list-style-type: none;
        margin:0;
        padding: 0;
        display: flex;
    flex-direction: column;
    gap: 8px;
        }

    .nav2 {
  display: flex;
  flex-direction: column;
  gap: 12px;           /* space between all items */
}

/* Extra space only before the button */
 .nav1 .login-btn {
  margin-top: 8px;     /* additional gap */
}
    .nav2 a{
        text-decoration: none ;
        color: #fff;
        display: block;
        padding: 10px;
        width:200px;

    }
    .nav2 a:hover{
        background-color: #0e850e !important;
    }
</style>

<body>
<div >
    <h2>Variation1: Horizontal with underline effect</h2>
    <nav class="nav1">
<li> <a href="#">Home</a></li>
<li > <a href="#">About </a></li>
<li> <a href="#">Products </a></li>
<li > <button class="login-btn" type="submit"> Login </button></li>
    
    </nav>
</div>
<div class="nav-container">
    <h2>Variation2: Verical with hover effect</h2>
    <nav class="nav2">
        <ul>
        <li > <a href="#">Home</a></li>
        <li> <a href="#">About </a></li>
        <li> <a href="#">Products</a></li>
        
        </ul>
        <form >
        <button class="login-btn" type="button"> Login</button>
        </form>
    </nav>
</div>
</body>
</html>
