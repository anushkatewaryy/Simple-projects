<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
</head>
<style>
    h2 {color: #08b70b;}
    body {font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif; background-color: #1a1a1a;height: 100vh; 
    display: flex;
    justify-content: center;
    align-items: center; }
    .card{ border-radius: 20px; width: 300px; background-color: #216f1f; margin: 10px; padding: 40px; }
    form {display: flex; flex-direction: column; gap:10px; }
    button {background-color: #2fe064; color:#fff; font-weight: 700px;}
    button:hover{background-color: #19952e;}
    input {margin-bottom: 20px; padding:10px;}
    
</style>
<body>
    
    <div class="card">
        <h2>Sign Up</h2>
    <form >
        <input type="text" placeholder="vorname">
        <input type="text" placeholder="nachname">
        <input type="email" placeholder="E-Mail">
        <input type="password" placeholder="password">
        <button type="submit">Sign up </button>
    </form>
    </div>
</body>
</html>
