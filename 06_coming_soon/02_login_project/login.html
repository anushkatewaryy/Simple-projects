<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<style>
    body { font-family: Arial, Helvetica, sans-serif;
        background-color: #1a1a1a;
    margin: 0; padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;}
    .card{background-color: #2c2c2c; border-radius: 8px;
    padding: 30px; width: 300px;}
    h2 {color: #fff; text-align: center;
    margin-top: 20px;}
    form{display: flex;
    flex-direction: column;
    gap:20px
    } 
    input {margin-bottom: 20px;
    padding: 10px;
    border-radius: 5px;
    ;
    border:2px solid black}
    button {background-color: #1b81da;
    color:#fff;
    padding: 10px; font-weight: 700;
    border-color: #1a1a1a;
    }
        button:hover{background-color: #1167b2; }
</style>
<body>
    <div class="card">
        <h2>Login</h2> 
        <form >
            <input type="email" name="" id="" placeholder="Email">
            <input type="password" name="" id="" placeholder="Password">
            <button type="submit">Login</button>
        </form>
    </div>
    
    
</body>
</html>
