<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body class="bg-gray-900 flex justify-center items-center min-h-screen">
    <div class="bg-gray-700 flex items-center justify-center flex-col p-8 rounded-lg shadow-lg max-w-sm w-full shadow-2xl">
        <h2 class="text-3xl text-amber-50 mb-6 font-bold">Login</h2>
        <form >
            <div>
            <label class="block text-sm  font-medium text-amber-50 mb-2 w-full">Email</label>
            <input type="email" name="" placeholder="Email" id="eml" class="bg-amber-50 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600 mb-1 w-full px-2 py-1">
            </div>
            <div>
            <label class="block text-sm  font-medium text-amber-50 mb-2">Password</label>
            <input type="password" name="" placeholder="Password" id="pswd"  
            class="bg-amber-50 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600 mb-1 w-full px-2 py-1">
        
            </div>
            <button type="submit" class=" bg-blue-600 text-white py-2 mt-4 rounded-lg w-full hover:bg-blue-700 hover:shadow-2xl">Login</button>
        </form>
    </div>
</body>
</html>
