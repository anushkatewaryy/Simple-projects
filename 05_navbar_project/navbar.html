<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nav-bar</title>
</head>
<style>
    .nav1 li a {
        padding: 5px 90px;
        text-decoration: none;
        position: relative;
         width: 40%;       /* underline is only 60% of link */
    height: 2px;

    left: 0;       /* centers the underline */
    bottom: -3px;
    }
     .nav1 li a::after{
        content: "";
        position: absolute;
        display:block;
        width:100%;
        height: 3px;
        left:0;
        bottom:0;
        background:blueviolet; 
        transition: width 0.3s; 
        transform: scaleX(0);
        transition: transform 0.3s
        ease-in-out ;  }   
        .nav1 li a:hover::after {
    width: 100%;
    transform: scaleX(1)
}
.nav1 {display: flex;
gap: 50px;
justify-content: center;
align-items: center;
 list-style: none;
    padding: 0;
    margin: 0;
    left: 0;

    gap: 2px;}
    .login-btn{ background-color: rgb(72, 72, 247);
    border-radius: 5px;
color: #fff;
width: 100px;
padding: 10px 25px;
box-sizing: content-box;}

</style>

<body>
<div >
    <nav class="nav1">
<li> <a href="#">Home</a></li>
<li > <a href="#">About </a></li>
<li> <a href="#">Products </a></li>
<li ><button class="login-btn">Login</button></li>
    
    </nav>
</div>
</body>
</html>
